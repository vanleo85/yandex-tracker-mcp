apiVersion: v1
kind: Pod
metadata:
  name: {{ include "common.names.fullname" . }}-test
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.labels "context" $ ) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "common.names.fullname" . }}:{{ .Values.service.ports.http }}']
  restartPolicy: Never
